<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원 클릭 게임 v5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.game{width:min(760px,94vw);background:#222;border:3px solid #555;border-radius:16px;padding:22px;box-shadow:0 12px 40px #000}
h1{text-align:center;margin:0 0 14px;font-size:32px}
.setup{text-align:center;margin-bottom:14px}
button{border:0;border-radius:10px;padding:10px 16px;margin:4px;font-size:16px;font-weight:bold;cursor:pointer}
.diff{background:#444;color:#fff}.diff.selected{background:#ff9f1c;color:#111}
#start{background:#38d16f;color:#111}
#home{background:#777;color:#fff;display:none}
button:disabled{opacity:.45;cursor:not-allowed}
.info{display:flex;justify-content:space-between;gap:10px;margin:12px 0;font-weight:bold}
.info span{background:#333;padding:10px 14px;border-radius:9px;flex:1;text-align:center}
#arena{height:430px;background:#181818;border:2px solid #444;border-radius:12px;position:relative;overflow:hidden;cursor:crosshair}
#target{position:absolute;width:58px;height:58px;border-radius:50%;background:#ff4757;border:4px solid #fff;box-shadow:0 0 18px #ff4757;cursor:pointer;transform:translate(-50%,-50%);animation:pop .12s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.35)}100%{transform:translate(-50%,-50%) scale(1)}}
.plus{position:absolute;color:#ffe66d;font-size:24px;font-weight:bold;pointer-events:none;animation:float .55s ease-out forwards}
@keyframes float{to{transform:translateY(-45px);opacity:0}}
#message{text-align:center;height:28px;margin-top:12px;font-size:18px}
#result{text-align:center;margin-top:8px;color:#ffd166;font-size:18px}
.devil-object{
  position:absolute;width:120px;height:105px;pointer-events:auto;z-index:5;cursor:pointer;
  clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:rgba(155,35,35,.82);
  border:0;
  filter:drop-shadow(0 0 8px rgba(255,70,70,.55));
}
.devil-object::after{
  content:"";position:absolute;inset:7px;clip-path:polygon(50% 0%,100% 100%,0% 100%);
  background:rgba(255,95,95,.20);
}
</style>
</head>
<body>
<div class="game">
<h1>🎯 원 클릭 게임</h1>
<div class="setup">
  <div>
    <button class="diff selected" data-mode="normal">🙂 보통</button>
    <button class="diff" data-mode="hard">🔥 어려움</button>
    <button class="diff" data-mode="devil">😈 악마</button>
  </div>
  <div id="modeLabel">현재 난이도: 보통</div>
  <button id="start">게임 시작</button>
  <button id="home">처음으로</button>
</div>
<div class="info">
  <span>점수 <b id="score">0</b></span>
  <span>시간 <b id="time">30</b></span>
  <span>최고 <b id="best">0</b></span>
</div>
<div id="arena"></div>
<div id="message">난이도를 선택하고 게임을 시작하세요!</div>
<div id="result"></div>
</div>

<script>
const arena=document.getElementById('arena');
const startBtn=document.getElementById('start');
const homeBtn=document.getElementById('home');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const bestEl=document.getElementById('best');
const message=document.getElementById('message');
const result=document.getElementById('result');
const modeLabel=document.getElementById('modeLabel');
const diffBtns=[...document.querySelectorAll('.diff')];

let difficulty='normal',running=false,score=0,time=30,timer=null,devilTimer=null,devilActive=false,clickCount=0,lastPos=null;
let best=Number(localStorage.getItem('clickBest')||0);
bestEl.textContent=best;

function setControls(playing){
  diffBtns.forEach(b=>b.disabled=playing);
  startBtn.disabled=playing;
  homeBtn.style.display=playing?'none':'inline-block';
}
function sound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=430+Math.min(clickCount,20)*18;
    g.gain.setValueAtTime(.06,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.08);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.08);
  }catch(e){}
}
function getNextPosition(){
  const margin=38;
  const maxX=arena.clientWidth-margin*2;
  const maxY=arena.clientHeight-margin*2;

  if(difficulty==='hard'){
    // 25% 확률: 중앙 주변으로 이동
    if(Math.random()<0.25){
      const cx=arena.clientWidth/2,cy=arena.clientHeight/2;
      const spread=90;
      return {
        x:Math.max(margin,Math.min(arena.clientWidth-margin,cx+(Math.random()*2-1)*spread)),
        y:Math.max(margin,Math.min(arena.clientHeight-margin,cy+(Math.random()*2-1)*spread))
      };
    }
    // 75% 확률: 이전 위치에서 최대한 멀리
    let best=null,bestDist=-1;
    for(let i=0;i<32;i++){
      const x=margin+Math.random()*maxX,y=margin+Math.random()*maxY;
      let dist=0;
      if(lastPos){const dx=x-lastPos.x,dy=y-lastPos.y;dist=dx*dx+dy*dy;}
      if(dist>bestDist){bestDist=dist;best={x,y};}
    }
    return best;
  }
  return {x:margin+Math.random()*maxX,y:margin+Math.random()*maxY};
}
function spawn(){
  const old=document.getElementById('target'); if(old)old.remove();
  const p=getNextPosition(); lastPos=p;
  const t=document.createElement('div');t.id='target';
  t.style.left=p.x+'px';t.style.top=p.y+'px';
  t.onclick=e=>{
    e.stopPropagation(); if(!running)return;
    clickCount++;score++;scoreEl.textContent=score;sound();
    const plus=document.createElement('div');plus.className='plus';plus.textContent='+1';
    plus.style.left=p.x+'px';plus.style.top=p.y+'px';arena.appendChild(plus);
    setTimeout(()=>plus.remove(),550);spawn();
  };
  arena.appendChild(t);
}

function spawnDevilObject(){
  if(!running || difficulty!=='devil' || devilActive) return;
  if(Math.random() >= 0.40) return; // 3초마다 40% 확률

  devilActive=true;
  const o=document.createElement('div');
  o.className='devil-object';
  o.setAttribute('aria-label','악마 방해 오브젝트');
  o.title='클릭하면 -1점';
  o.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(!running) return;
    score--;
    scoreEl.textContent=score;
    sound();
    const minus=document.createElement('div');
    minus.className='plus';
    minus.textContent='-1';
    minus.style.color='#ff6b6b';
    const rect=o.getBoundingClientRect();
    const ar=arena.getBoundingClientRect();
    minus.style.left=(rect.left-ar.left+rect.width/2)+'px';
    minus.style.top=(rect.top-ar.top+rect.height/2)+'px';
    arena.appendChild(minus);
    setTimeout(()=>minus.remove(),550);
  });
  arena.appendChild(o);

  const fromLeft=Math.random()<0.5;
  const startX=fromLeft ? -90 : arena.clientWidth+90;
  const endX=fromLeft ? arena.clientWidth+90 : -90;
  const y=45+Math.random()*(arena.clientHeight-90);
  const duration=1300+Math.random()*900;

  o.style.left=startX+'px';
  o.style.top=y+'px';

  const anim=o.animate(
    [{transform:`translateX(0)`},{transform:`translateX(${endX-startX}px)`}],
    {duration,easing:'linear'}
  );

  anim.onfinish=()=>{
    o.remove();
    devilActive=false;
  };
}

function startGame(){
  clearInterval(timer);clearInterval(devilTimer);running=true;score=0;time=30;clickCount=0;lastPos=null;devilActive=false;
  scoreEl.textContent=0;timeEl.textContent=30;result.textContent='';
  message.textContent='타겟을 최대한 많이 클릭하세요!';
  setControls(true);spawn();
  devilTimer=setInterval(spawnDevilObject,3000);
  timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end();},1000);
}
function end(){
  clearInterval(timer);clearInterval(devilTimer);timer=null;devilTimer=null;running=false;devilActive=false;
  const t=document.getElementById('target');if(t)t.remove();document.querySelectorAll('.devil-object').forEach(o=>o.remove());
  message.textContent='게임 종료!';
  if(score>best){best=score;localStorage.setItem('clickBest',best);bestEl.textContent=best;}
  result.textContent=`${difficulty==='devil'?'😈 악마':difficulty==='hard'?'🔥 어려움':'🙂 보통'} · 최종 점수 ${score}점`;
  startBtn.textContent='다시 시작';setControls(false);
}
function goHome(){
  clearInterval(timer);clearInterval(devilTimer);timer=null;devilTimer=null;running=false;devilActive=false;score=0;time=30;clickCount=0;lastPos=null;
  scoreEl.textContent=0;timeEl.textContent=30;result.textContent='';
  const t=document.getElementById('target');if(t)t.remove();document.querySelectorAll('.devil-object').forEach(o=>o.remove());
  difficulty='normal';diffBtns.forEach(b=>b.classList.toggle('selected',b.dataset.mode==='normal'));
  modeLabel.textContent='현재 난이도: 보통';message.textContent='난이도를 선택하고 게임을 시작하세요!';
  startBtn.textContent='게임 시작';startBtn.disabled=false;homeBtn.style.display='none';
  diffBtns.forEach(b=>b.disabled=false);
}
diffBtns.forEach(b=>b.onclick=()=>{
  if(running)return;
  difficulty=b.dataset.mode;diffBtns.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');
  modeLabel.textContent=`현재 난이도: ${difficulty==='devil'?'악마':difficulty==='hard'?'어려움':'보통'}`;
});
startBtn.onclick=startGame;homeBtn.onclick=goHome;
</script>
</body>
</html>
